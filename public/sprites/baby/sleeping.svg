<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="160" height="160" shape-rendering="crispEdges">
  <!-- Body (same as neutral blue) -->
  <rect x="4" y="4" width="8" height="8" fill="#6db3f2"/>
  <rect x="3" y="5" width="1" height="6" fill="#6db3f2"/>
  <rect x="12" y="5" width="1" height="6" fill="#6db3f2"/>
  <rect x="5" y="3" width="6" height="1" fill="#6db3f2"/>
  <rect x="5" y="12" width="6" height="1" fill="#6db3f2"/>
  <!-- Closed eyes (horizontal lines) -->
  <rect x="5" y="7" width="2" height="1" fill="#1a1a2e"/>
  <rect x="9" y="7" width="2" height="1" fill="#1a1a2e"/>
  <!-- Sleeping mouth (small) -->
  <rect x="7" y="9" width="2" height="1" fill="#1a1a2e"/>
  <!-- Cheeks -->
  <rect x="5" y="8" width="1" height="1" fill="#ff9999" opacity="0.4"/>
  <rect x="10" y="8" width="1" height="1" fill="#ff9999" opacity="0.4"/>
  <!-- Feet -->
  <rect x="5" y="13" width="2" height="1" fill="#5a9ad5"/>
  <rect x="9" y="13" width="2" height="1" fill="#5a9ad5"/>
  <!-- Zzz -->
  <rect x="12" y="2" width="2" height="1" fill="#aac8ff" opacity="0.8"/>
  <rect x="13" y="3" width="1" height="1" fill="#aac8ff" opacity="0.6"/>
  <rect x="12" y="4" width="2" height="1" fill="#aac8ff" opacity="0.4"/>
  <rect x="14" y="1" width="1" height="1" fill="#aac8ff" opacity="0.5"/>
</svg>
