<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="160" height="160" shape-rendering="crispEdges">
  <!-- Body -->
  <rect x="4" y="4" width="8" height="8" fill="#5cb85c"/>
  <rect x="3" y="5" width="1" height="6" fill="#5cb85c"/>
  <rect x="12" y="5" width="1" height="6" fill="#5cb85c"/>
  <rect x="5" y="3" width="6" height="1" fill="#5cb85c"/>
  <rect x="5" y="12" width="6" height="1" fill="#5cb85c"/>
  <!-- Eyes -->
  <rect x="6" y="6" width="1" height="2" fill="#1a1a2e"/>
  <rect x="9" y="6" width="1" height="2" fill="#1a1a2e"/>
  <!-- Eye shine -->
  <rect x="6" y="6" width="1" height="1" fill="#fff"/>
  <rect x="9" y="6" width="1" height="1" fill="#fff"/>
  <!-- Happy mouth -->
  <rect x="6" y="9" width="1" height="1" fill="#1a1a2e"/>
  <rect x="7" y="10" width="2" height="1" fill="#1a1a2e"/>
  <rect x="9" y="9" width="1" height="1" fill="#1a1a2e"/>
  <!-- Cheeks (blush) -->
  <rect x="5" y="8" width="1" height="1" fill="#ff9999" opacity="0.6"/>
  <rect x="10" y="8" width="1" height="1" fill="#ff9999" opacity="0.6"/>
  <!-- Feet -->
  <rect x="5" y="13" width="2" height="1" fill="#4a9e4a"/>
  <rect x="9" y="13" width="2" height="1" fill="#4a9e4a"/>
  <!-- Sparkle -->
  <rect x="13" y="3" width="1" height="1" fill="#ffd700"/>
  <rect x="14" y="2" width="1" height="1" fill="#ffd700"/>
  <rect x="13" y="2" width="1" height="1" fill="#ffd700" opacity="0.5"/>
</svg>
