<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="160" height="160" shape-rendering="crispEdges">
  <!-- Body -->
  <rect x="4" y="4" width="8" height="8" fill="#7b8ca8"/>
  <rect x="3" y="5" width="1" height="6" fill="#7b8ca8"/>
  <rect x="12" y="5" width="1" height="6" fill="#7b8ca8"/>
  <rect x="5" y="3" width="6" height="1" fill="#7b8ca8"/>
  <rect x="5" y="12" width="6" height="1" fill="#7b8ca8"/>
  <!-- Eyes (droopy) -->
  <rect x="6" y="7" width="1" height="1" fill="#1a1a2e"/>
  <rect x="9" y="7" width="1" height="1" fill="#1a1a2e"/>
  <!-- Eyebrow droop -->
  <rect x="5" y="6" width="2" height="1" fill="#5a6b82"/>
  <rect x="9" y="6" width="2" height="1" fill="#5a6b82"/>
  <!-- Sad mouth (frown) -->
  <rect x="7" y="10" width="2" height="1" fill="#1a1a2e"/>
  <rect x="6" y="9" width="1" height="1" fill="#1a1a2e"/>
  <rect x="9" y="9" width="1" height="1" fill="#1a1a2e"/>
  <!-- Tear -->
  <rect x="5" y="8" width="1" height="1" fill="#4da6ff"/>
  <rect x="5" y="9" width="1" height="1" fill="#4da6ff" opacity="0.6"/>
  <!-- Feet -->
  <rect x="5" y="13" width="2" height="1" fill="#6a7b96"/>
  <rect x="9" y="13" width="2" height="1" fill="#6a7b96"/>
</svg>
