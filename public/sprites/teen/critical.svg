<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="160" height="160" shape-rendering="crispEdges">
  <!-- Body (dark orange/burnt, critical) -->
  <rect x="4" y="5" width="8" height="8" fill="#a04000"/>
  <rect x="3" y="6" width="1" height="6" fill="#a04000"/>
  <rect x="12" y="6" width="1" height="6" fill="#a04000"/>
  <rect x="5" y="4" width="6" height="1" fill="#a04000"/>
  <rect x="5" y="13" width="6" height="1" fill="#a04000"/>
  <!-- Spiky hair (wilted) -->
  <rect x="6" y="2" width="1" height="2" fill="#803300"/>
  <rect x="8" y="2" width="1" height="2" fill="#803300"/>
  <rect x="7" y="3" width="1" height="1" fill="#803300"/>
  <!-- X eyes -->
  <rect x="5" y="6" width="1" height="1" fill="#1a1a2e"/>
  <rect x="7" y="6" width="1" height="1" fill="#1a1a2e"/>
  <rect x="6" y="7" width="1" height="1" fill="#1a1a2e"/>
  <rect x="5" y="8" width="1" height="1" fill="#1a1a2e"/>
  <rect x="7" y="8" width="1" height="1" fill="#1a1a2e"/>
  <rect x="9" y="6" width="1" height="1" fill="#1a1a2e"/>
  <rect x="11" y="6" width="1" height="1" fill="#1a1a2e"/>
  <rect x="10" y="7" width="1" height="1" fill="#1a1a2e"/>
  <rect x="9" y="8" width="1" height="1" fill="#1a1a2e"/>
  <rect x="11" y="8" width="1" height="1" fill="#1a1a2e"/>
  <!-- Wavy mouth -->
  <rect x="7" y="10" width="2" height="1" fill="#1a1a2e"/>
  <!-- Sweat drops -->
  <rect x="3" y="4" width="1" height="1" fill="#4da6ff"/>
  <rect x="3" y="5" width="1" height="1" fill="#4da6ff" opacity="0.5"/>
  <rect x="13" y="4" width="1" height="1" fill="#4da6ff"/>
  <rect x="13" y="5" width="1" height="1" fill="#4da6ff" opacity="0.5"/>
  <!-- Warning exclamation -->
  <rect x="1" y="1" width="1" height="3" fill="#ff4444"/>
  <rect x="1" y="5" width="1" height="1" fill="#ff4444"/>
  <!-- Feet -->
  <rect x="5" y="14" width="2" height="1" fill="#803300"/>
  <rect x="9" y="14" width="2" height="1" fill="#803300"/>
</svg>
