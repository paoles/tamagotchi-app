<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="160" height="160" shape-rendering="crispEdges">
  <!-- Body (orange with brownish tinge) -->
  <rect x="4" y="4" width="8" height="9" fill="#a87840"/>
  <rect x="3" y="5" width="1" height="7" fill="#a87840"/>
  <rect x="12" y="5" width="1" height="7" fill="#a87840"/>
  <rect x="5" y="3" width="6" height="1" fill="#a87840"/>
  <rect x="5" y="13" width="6" height="1" fill="#a87840"/>
  <!-- Spiky hair (messy) -->
  <rect x="5" y="1" width="1" height="2" fill="#8a6230"/>
  <rect x="7" y="0" width="1" height="3" fill="#8a6230"/>
  <rect x="9" y="1" width="1" height="2" fill="#8a6230"/>
  <rect x="10" y="2" width="1" height="1" fill="#8a6230"/>
  <!-- Dirt/brown spots -->
  <rect x="4" y="5" width="1" height="1" fill="#6b5a42"/>
  <rect x="10" y="7" width="1" height="1" fill="#6b5a42"/>
  <rect x="7" y="12" width="1" height="1" fill="#6b5a42"/>
  <rect x="11" y="10" width="1" height="1" fill="#6b5a42"/>
  <rect x="5" y="9" width="1" height="1" fill="#6b5a42"/>
  <!-- Eyes (squinting) -->
  <rect x="6" y="7" width="1" height="1" fill="#1a1a2e"/>
  <rect x="9" y="7" width="1" height="1" fill="#1a1a2e"/>
  <!-- Squint lines -->
  <rect x="5" y="6" width="3" height="1" fill="#8a6230"/>
  <rect x="8" y="6" width="3" height="1" fill="#8a6230"/>
  <!-- Wavy mouth (uncomfortable) -->
  <rect x="6" y="10" width="1" height="1" fill="#1a1a2e"/>
  <rect x="7" y="11" width="1" height="1" fill="#1a1a2e"/>
  <rect x="8" y="10" width="1" height="1" fill="#1a1a2e"/>
  <rect x="9" y="11" width="1" height="1" fill="#1a1a2e"/>
  <!-- Stink lines -->
  <rect x="2" y="3" width="1" height="2" fill="#8fbc8f" opacity="0.5"/>
  <rect x="1" y="5" width="1" height="1" fill="#8fbc8f" opacity="0.3"/>
  <rect x="13" y="3" width="1" height="2" fill="#8fbc8f" opacity="0.5"/>
  <rect x="14" y="5" width="1" height="1" fill="#8fbc8f" opacity="0.3"/>
  <!-- Feet -->
  <rect x="5" y="14" width="2" height="1" fill="#8a6230"/>
  <rect x="9" y="14" width="2" height="1" fill="#8a6230"/>
</svg>
