<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="160" height="160" shape-rendering="crispEdges">
  <!-- Body (orange, taller 8x9) -->
  <rect x="4" y="4" width="8" height="9" fill="#e67e22"/>
  <rect x="3" y="5" width="1" height="7" fill="#e67e22"/>
  <rect x="12" y="5" width="1" height="7" fill="#e67e22"/>
  <rect x="5" y="3" width="6" height="1" fill="#e67e22"/>
  <rect x="5" y="13" width="6" height="1" fill="#e67e22"/>
  <!-- Spiky hair -->
  <rect x="5" y="1" width="1" height="2" fill="#d35400"/>
  <rect x="7" y="0" width="1" height="3" fill="#d35400"/>
  <rect x="9" y="1" width="1" height="2" fill="#d35400"/>
  <rect x="6" y="2" width="1" height="1" fill="#d35400"/>
  <rect x="8" y="2" width="1" height="1" fill="#d35400"/>
  <rect x="10" y="2" width="1" height="1" fill="#d35400"/>
  <!-- Closed eyes (horizontal lines) -->
  <rect x="5" y="7" width="2" height="1" fill="#1a1a2e"/>
  <rect x="9" y="7" width="2" height="1" fill="#1a1a2e"/>
  <!-- Sleeping mouth (small) -->
  <rect x="7" y="10" width="2" height="1" fill="#1a1a2e"/>
  <!-- Cheeks -->
  <rect x="5" y="8" width="1" height="1" fill="#ff9999" opacity="0.4"/>
  <rect x="10" y="8" width="1" height="1" fill="#ff9999" opacity="0.4"/>
  <!-- Feet -->
  <rect x="5" y="14" width="2" height="1" fill="#bf6516"/>
  <rect x="9" y="14" width="2" height="1" fill="#bf6516"/>
  <!-- Zzz -->
  <rect x="12" y="1" width="2" height="1" fill="#f5c07a" opacity="0.8"/>
  <rect x="13" y="2" width="1" height="1" fill="#f5c07a" opacity="0.6"/>
  <rect x="12" y="3" width="2" height="1" fill="#f5c07a" opacity="0.4"/>
  <rect x="14" y="0" width="1" height="1" fill="#f5c07a" opacity="0.5"/>
</svg>
