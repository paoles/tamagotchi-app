<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="160" height="160" shape-rendering="crispEdges">
  <!-- Body (greyed out) -->
  <rect x="4" y="5" width="8" height="8" fill="#888"/>
  <rect x="3" y="6" width="1" height="6" fill="#888"/>
  <rect x="12" y="6" width="1" height="6" fill="#888"/>
  <rect x="5" y="4" width="6" height="1" fill="#888"/>
  <rect x="5" y="13" width="6" height="1" fill="#888"/>
  <!-- Spiky hair (grey) -->
  <rect x="5" y="2" width="1" height="2" fill="#777"/>
  <rect x="7" y="1" width="1" height="3" fill="#777"/>
  <rect x="9" y="2" width="1" height="2" fill="#777"/>
  <rect x="6" y="3" width="1" height="1" fill="#777"/>
  <rect x="8" y="3" width="1" height="1" fill="#777"/>
  <!-- X eyes -->
  <rect x="5" y="6" width="1" height="1" fill="#444"/>
  <rect x="7" y="6" width="1" height="1" fill="#444"/>
  <rect x="6" y="7" width="1" height="1" fill="#444"/>
  <rect x="5" y="8" width="1" height="1" fill="#444"/>
  <rect x="7" y="8" width="1" height="1" fill="#444"/>
  <rect x="9" y="6" width="1" height="1" fill="#444"/>
  <rect x="11" y="6" width="1" height="1" fill="#444"/>
  <rect x="10" y="7" width="1" height="1" fill="#444"/>
  <rect x="9" y="8" width="1" height="1" fill="#444"/>
  <rect x="11" y="8" width="1" height="1" fill="#444"/>
  <!-- Flat mouth -->
  <rect x="7" y="10" width="2" height="1" fill="#444"/>
  <!-- Halo -->
  <rect x="6" y="0" width="4" height="1" fill="#ffd700" opacity="0.6"/>
  <rect x="5" y="1" width="1" height="1" fill="#ffd700" opacity="0.6"/>
  <rect x="10" y="1" width="1" height="1" fill="#ffd700" opacity="0.6"/>
  <!-- Feet -->
  <rect x="5" y="14" width="2" height="1" fill="#666"/>
  <rect x="9" y="14" width="2" height="1" fill="#666"/>
</svg>
