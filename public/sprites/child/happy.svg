<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="160" height="160" shape-rendering="crispEdges">
  <!-- Body (purple, slightly bigger than baby) -->
  <rect x="4" y="4" width="8" height="9" fill="#9b59b6"/>
  <rect x="3" y="5" width="1" height="7" fill="#9b59b6"/>
  <rect x="12" y="5" width="1" height="7" fill="#9b59b6"/>
  <rect x="5" y="3" width="6" height="1" fill="#9b59b6"/>
  <rect x="5" y="13" width="6" height="1" fill="#9b59b6"/>
  <!-- Tuft on head -->
  <rect x="7" y="1" width="2" height="2" fill="#8e44ad"/>
  <rect x="6" y="2" width="1" height="1" fill="#8e44ad"/>
  <rect x="9" y="2" width="1" height="1" fill="#8e44ad"/>
  <!-- Eyes -->
  <rect x="6" y="6" width="1" height="2" fill="#1a1a2e"/>
  <rect x="9" y="6" width="1" height="2" fill="#1a1a2e"/>
  <!-- Eye shine -->
  <rect x="6" y="6" width="1" height="1" fill="#fff"/>
  <rect x="9" y="6" width="1" height="1" fill="#fff"/>
  <!-- Happy mouth (smile) -->
  <rect x="6" y="10" width="1" height="1" fill="#1a1a2e"/>
  <rect x="7" y="11" width="2" height="1" fill="#1a1a2e"/>
  <rect x="9" y="10" width="1" height="1" fill="#1a1a2e"/>
  <!-- Cheeks (blush) -->
  <rect x="5" y="9" width="1" height="1" fill="#ff9999" opacity="0.6"/>
  <rect x="10" y="9" width="1" height="1" fill="#ff9999" opacity="0.6"/>
  <!-- Feet -->
  <rect x="5" y="14" width="2" height="1" fill="#7d3c98"/>
  <rect x="9" y="14" width="2" height="1" fill="#7d3c98"/>
  <!-- Sparkle -->
  <rect x="13" y="3" width="1" height="1" fill="#ffd700"/>
  <rect x="14" y="2" width="1" height="1" fill="#ffd700"/>
  <rect x="13" y="2" width="1" height="1" fill="#ffd700" opacity="0.5"/>
</svg>
