<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="160" height="160" shape-rendering="crispEdges">
  <!-- Body (muted blue) -->
  <rect x="3" y="4" width="10" height="10" fill="#4a6a94"/>
  <rect x="2" y="5" width="1" height="8" fill="#4a6a94"/>
  <rect x="13" y="5" width="1" height="8" fill="#4a6a94"/>
  <rect x="4" y="3" width="8" height="1" fill="#4a6a94"/>
  <rect x="4" y="14" width="8" height="1" fill="#4a6a94"/>
  <!-- Crown (tilted/sad) -->
  <rect x="5" y="1" width="6" height="2" fill="#d4af37" opacity="0.7"/>
  <rect x="5" y="0" width="1" height="1" fill="#d4af37" opacity="0.7"/>
  <rect x="7" y="0" width="2" height="1" fill="#d4af37" opacity="0.7"/>
  <rect x="10" y="0" width="1" height="1" fill="#d4af37" opacity="0.7"/>
  <!-- Crown jewel -->
  <rect x="7" y="1" width="2" height="1" fill="#c0392b" opacity="0.7"/>
  <!-- Eyes (droopy) -->
  <rect x="6" y="7" width="1" height="1" fill="#1a1a2e"/>
  <rect x="9" y="7" width="1" height="1" fill="#1a1a2e"/>
  <!-- Eyebrow droop -->
  <rect x="5" y="6" width="2" height="1" fill="#3a5578"/>
  <rect x="9" y="6" width="2" height="1" fill="#3a5578"/>
  <!-- Sad mouth (frown) -->
  <rect x="7" y="11" width="2" height="1" fill="#1a1a2e"/>
  <rect x="6" y="10" width="1" height="1" fill="#1a1a2e"/>
  <rect x="9" y="10" width="1" height="1" fill="#1a1a2e"/>
  <!-- Tear -->
  <rect x="4" y="8" width="1" height="1" fill="#4da6ff"/>
  <rect x="4" y="9" width="1" height="1" fill="#4da6ff" opacity="0.6"/>
  <!-- Feet -->
  <rect x="5" y="15" width="2" height="1" fill="#2c3e6e"/>
  <rect x="9" y="15" width="2" height="1" fill="#2c3e6e"/>
</svg>
