<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="160" height="160" shape-rendering="crispEdges">
  <!-- Body (deep blue, largest 9x10) -->
  <rect x="3" y="4" width="10" height="10" fill="#3b5998"/>
  <rect x="2" y="5" width="1" height="8" fill="#3b5998"/>
  <rect x="13" y="5" width="1" height="8" fill="#3b5998"/>
  <rect x="4" y="3" width="8" height="1" fill="#3b5998"/>
  <rect x="4" y="14" width="8" height="1" fill="#3b5998"/>
  <!-- Crown accessory -->
  <rect x="5" y="1" width="6" height="2" fill="#ffd700"/>
  <rect x="5" y="0" width="1" height="1" fill="#ffd700"/>
  <rect x="7" y="0" width="2" height="1" fill="#ffd700"/>
  <rect x="10" y="0" width="1" height="1" fill="#ffd700"/>
  <!-- Crown jewel -->
  <rect x="7" y="1" width="2" height="1" fill="#e74c3c"/>
  <!-- Closed eyes (horizontal lines) -->
  <rect x="5" y="7" width="2" height="1" fill="#1a1a2e"/>
  <rect x="9" y="7" width="2" height="1" fill="#1a1a2e"/>
  <!-- Sleeping mouth (small) -->
  <rect x="7" y="10" width="2" height="1" fill="#1a1a2e"/>
  <!-- Cheeks -->
  <rect x="4" y="8" width="1" height="1" fill="#ff9999" opacity="0.4"/>
  <rect x="11" y="8" width="1" height="1" fill="#ff9999" opacity="0.4"/>
  <!-- Feet -->
  <rect x="5" y="15" width="2" height="1" fill="#2c3e6e"/>
  <rect x="9" y="15" width="2" height="1" fill="#2c3e6e"/>
  <!-- Zzz -->
  <rect x="13" y="1" width="2" height="1" fill="#8aa8d8" opacity="0.8"/>
  <rect x="14" y="2" width="1" height="1" fill="#8aa8d8" opacity="0.6"/>
  <rect x="13" y="3" width="2" height="1" fill="#8aa8d8" opacity="0.4"/>
  <rect x="15" y="0" width="1" height="1" fill="#8aa8d8" opacity="0.5"/>
</svg>
