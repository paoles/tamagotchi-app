<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="160" height="160" shape-rendering="crispEdges">
  <!-- Body (very dark blue, critical) -->
  <rect x="3" y="4" width="10" height="10" fill="#1a2a4a"/>
  <rect x="2" y="5" width="1" height="8" fill="#1a2a4a"/>
  <rect x="13" y="5" width="1" height="8" fill="#1a2a4a"/>
  <rect x="4" y="3" width="8" height="1" fill="#1a2a4a"/>
  <rect x="4" y="14" width="8" height="1" fill="#1a2a4a"/>
  <!-- Crown (fallen/tilted) -->
  <rect x="5" y="1" width="5" height="2" fill="#b8960f" opacity="0.5"/>
  <rect x="5" y="0" width="1" height="1" fill="#b8960f" opacity="0.5"/>
  <rect x="7" y="0" width="1" height="1" fill="#b8960f" opacity="0.5"/>
  <!-- X eyes -->
  <rect x="5" y="6" width="1" height="1" fill="#1a1a2e"/>
  <rect x="7" y="6" width="1" height="1" fill="#1a1a2e"/>
  <rect x="6" y="7" width="1" height="1" fill="#1a1a2e"/>
  <rect x="5" y="8" width="1" height="1" fill="#1a1a2e"/>
  <rect x="7" y="8" width="1" height="1" fill="#1a1a2e"/>
  <rect x="9" y="6" width="1" height="1" fill="#1a1a2e"/>
  <rect x="11" y="6" width="1" height="1" fill="#1a1a2e"/>
  <rect x="10" y="7" width="1" height="1" fill="#1a1a2e"/>
  <rect x="9" y="8" width="1" height="1" fill="#1a1a2e"/>
  <rect x="11" y="8" width="1" height="1" fill="#1a1a2e"/>
  <!-- Wavy mouth -->
  <rect x="7" y="10" width="2" height="1" fill="#1a1a2e"/>
  <!-- Sweat drops -->
  <rect x="1" y="4" width="1" height="1" fill="#4da6ff"/>
  <rect x="1" y="5" width="1" height="1" fill="#4da6ff" opacity="0.5"/>
  <rect x="14" y="4" width="1" height="1" fill="#4da6ff"/>
  <rect x="14" y="5" width="1" height="1" fill="#4da6ff" opacity="0.5"/>
  <!-- Warning exclamation -->
  <rect x="0" y="1" width="1" height="3" fill="#ff4444"/>
  <rect x="0" y="5" width="1" height="1" fill="#ff4444"/>
  <!-- Feet -->
  <rect x="5" y="15" width="2" height="1" fill="#101a30"/>
  <rect x="9" y="15" width="2" height="1" fill="#101a30"/>
</svg>
