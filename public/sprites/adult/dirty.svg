<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="160" height="160" shape-rendering="crispEdges">
  <!-- Body (blue with brownish tinge) -->
  <rect x="3" y="4" width="10" height="10" fill="#4a5a6e"/>
  <rect x="2" y="5" width="1" height="8" fill="#4a5a6e"/>
  <rect x="13" y="5" width="1" height="8" fill="#4a5a6e"/>
  <rect x="4" y="3" width="8" height="1" fill="#4a5a6e"/>
  <rect x="4" y="14" width="8" height="1" fill="#4a5a6e"/>
  <!-- Crown (dirty/tarnished) -->
  <rect x="5" y="1" width="6" height="2" fill="#b8960f" opacity="0.6"/>
  <rect x="5" y="0" width="1" height="1" fill="#b8960f" opacity="0.6"/>
  <rect x="7" y="0" width="2" height="1" fill="#b8960f" opacity="0.6"/>
  <rect x="10" y="0" width="1" height="1" fill="#b8960f" opacity="0.6"/>
  <!-- Dirt/brown spots -->
  <rect x="4" y="5" width="1" height="1" fill="#6b5a42"/>
  <rect x="10" y="7" width="1" height="1" fill="#6b5a42"/>
  <rect x="7" y="13" width="1" height="1" fill="#6b5a42"/>
  <rect x="12" y="10" width="1" height="1" fill="#6b5a42"/>
  <rect x="4" y="9" width="1" height="1" fill="#6b5a42"/>
  <rect x="9" y="12" width="1" height="1" fill="#6b5a42"/>
  <!-- Eyes (squinting) -->
  <rect x="6" y="7" width="1" height="1" fill="#1a1a2e"/>
  <rect x="9" y="7" width="1" height="1" fill="#1a1a2e"/>
  <!-- Squint lines -->
  <rect x="5" y="6" width="3" height="1" fill="#3d4d5e"/>
  <rect x="8" y="6" width="3" height="1" fill="#3d4d5e"/>
  <!-- Wavy mouth (uncomfortable) -->
  <rect x="6" y="10" width="1" height="1" fill="#1a1a2e"/>
  <rect x="7" y="11" width="1" height="1" fill="#1a1a2e"/>
  <rect x="8" y="10" width="1" height="1" fill="#1a1a2e"/>
  <rect x="9" y="11" width="1" height="1" fill="#1a1a2e"/>
  <!-- Stink lines -->
  <rect x="1" y="3" width="1" height="2" fill="#8fbc8f" opacity="0.5"/>
  <rect x="0" y="5" width="1" height="1" fill="#8fbc8f" opacity="0.3"/>
  <rect x="14" y="3" width="1" height="2" fill="#8fbc8f" opacity="0.5"/>
  <rect x="15" y="5" width="1" height="1" fill="#8fbc8f" opacity="0.3"/>
  <!-- Feet -->
  <rect x="5" y="15" width="2" height="1" fill="#3d4d5e"/>
  <rect x="9" y="15" width="2" height="1" fill="#3d4d5e"/>
</svg>
