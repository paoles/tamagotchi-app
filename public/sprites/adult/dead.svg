<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="160" height="160" shape-rendering="crispEdges">
  <!-- Body (greyed out) -->
  <rect x="3" y="4" width="10" height="10" fill="#888"/>
  <rect x="2" y="5" width="1" height="8" fill="#888"/>
  <rect x="13" y="5" width="1" height="8" fill="#888"/>
  <rect x="4" y="3" width="8" height="1" fill="#888"/>
  <rect x="4" y="14" width="8" height="1" fill="#888"/>
  <!-- Crown (grey, faded) -->
  <rect x="5" y="1" width="6" height="2" fill="#999" opacity="0.5"/>
  <rect x="5" y="0" width="1" height="1" fill="#999" opacity="0.5"/>
  <rect x="7" y="0" width="2" height="1" fill="#999" opacity="0.5"/>
  <rect x="10" y="0" width="1" height="1" fill="#999" opacity="0.5"/>
  <!-- X eyes -->
  <rect x="5" y="6" width="1" height="1" fill="#444"/>
  <rect x="7" y="6" width="1" height="1" fill="#444"/>
  <rect x="6" y="7" width="1" height="1" fill="#444"/>
  <rect x="5" y="8" width="1" height="1" fill="#444"/>
  <rect x="7" y="8" width="1" height="1" fill="#444"/>
  <rect x="9" y="6" width="1" height="1" fill="#444"/>
  <rect x="11" y="6" width="1" height="1" fill="#444"/>
  <rect x="10" y="7" width="1" height="1" fill="#444"/>
  <rect x="9" y="8" width="1" height="1" fill="#444"/>
  <rect x="11" y="8" width="1" height="1" fill="#444"/>
  <!-- Flat mouth -->
  <rect x="7" y="10" width="2" height="1" fill="#444"/>
  <!-- Halo (larger for adult) -->
  <rect x="4" y="0" width="1" height="1" fill="#ffd700" opacity="0.6"/>
  <rect x="11" y="0" width="1" height="1" fill="#ffd700" opacity="0.6"/>
  <rect x="3" y="1" width="1" height="1" fill="#ffd700" opacity="0.4"/>
  <rect x="12" y="1" width="1" height="1" fill="#ffd700" opacity="0.4"/>
  <!-- Feet -->
  <rect x="5" y="15" width="2" height="1" fill="#666"/>
  <rect x="9" y="15" width="2" height="1" fill="#666"/>
</svg>
