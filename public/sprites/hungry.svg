<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="160" height="160" shape-rendering="crispEdges">
  <!-- Body -->
  <rect x="4" y="4" width="8" height="8" fill="#f0ad4e"/>
  <rect x="3" y="5" width="1" height="6" fill="#f0ad4e"/>
  <rect x="12" y="5" width="1" height="6" fill="#f0ad4e"/>
  <rect x="5" y="3" width="6" height="1" fill="#f0ad4e"/>
  <rect x="5" y="12" width="6" height="1" fill="#f0ad4e"/>
  <!-- Eyes (wide, pleading) -->
  <rect x="5" y="6" width="2" height="2" fill="#1a1a2e"/>
  <rect x="9" y="6" width="2" height="2" fill="#1a1a2e"/>
  <!-- Eye shine (bigger for cute look) -->
  <rect x="5" y="6" width="1" height="1" fill="#fff"/>
  <rect x="9" y="6" width="1" height="1" fill="#fff"/>
  <!-- Open mouth (hungry) -->
  <rect x="7" y="9" width="2" height="2" fill="#1a1a2e"/>
  <rect x="7" y="9" width="2" height="1" fill="#cc3333"/>
  <!-- Feet -->
  <rect x="5" y="13" width="2" height="1" fill="#d49a45"/>
  <rect x="9" y="13" width="2" height="1" fill="#d49a45"/>
  <!-- Thought bubble (food) -->
  <rect x="13" y="2" width="2" height="2" fill="#fff" opacity="0.7"/>
  <rect x="12" y="4" width="1" height="1" fill="#fff" opacity="0.5"/>
</svg>
